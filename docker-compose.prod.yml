services:
  ai-service:
    image: respicare-ai:latest
    container_name: respicare-ai

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env.production

    volumes:
      - ./model_artifacts:/app/model_artifacts:ro

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
